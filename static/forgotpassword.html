<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kakeibo Budgeting | Forgot Password</title>
    <link rel="stylesheet" href="/web/css/login.css" />
  </head>
  <body>
    <header>
      <h1>Kakeibo Budgeting</h1>
    </header>

    <main>
      <h1>Reset Your Password</h1>

      <div id="step-container">
        <form id="step1-form" class="step-form">
          <div class="form-group">
            <label for="email">Email (Username)</label>
            <input type="email" id="email" name="email" required />
          </div>
          <button type="submit">Verify</button>
        </form>

        <form id="step2-form" class="step-form hidden">
          <div class="form-group">
            <label for="otp">OTP</label>
            <input type="number" id="otp" name="otp" required />
          </div>
          <button type="submit">Verify</button>
        </form>

        <form id="step3-form" class="step-form hidden">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
          </div>
          <button type="submit">Confirm</button>
        </form>
      </div>
    </main>

    <script src="/web/js/forgotpassword.js"></script>
  </body>
</html>
