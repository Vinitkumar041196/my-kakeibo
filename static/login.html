<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kakeibo Budgeting | Sign Up</title>
    <link rel="stylesheet" href="/web/css/login.css" />
  </head>
  <body>
    <header>
      <h1>Kakeibo Budgeting</h1>
    </header>

    <main>
      <div id="form-switcher">
        <div id="show-login" class="form-switch"><h3>Log In</h3></div>
        <div id="show-signup" class="form-switch"><h3>Sign Up</h3></div>
      </div>

      <div id="form-container">
        <h1 id="form-title"></h1>
        <!-- Sign Up Form -->
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
          <div class="form-group">
            <label for="email">Email (Username)</label>
            <input type="email" id="signup-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="signup-password"
              name="password"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
          </div>
          <button type="submit">Sign Up</button>
          <!-- <p>Already have an account? <a href="login.html">Log in here</a>.</p> -->
        </form>
        <!-- Login Form -->
        <form id="login-form" class="hidden">
          <div class="form-group">
            <label for="email">Email (Username)</label>
            <input type="email" id="login-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              required
            />
          </div>
          <button type="submit">Log In</button>
          <!-- <p>Don't have an account? <a href="login.html">Sign up here</a>.</p> -->
          <p>
            <a href="forgotpassword.html">Forgot password?</a>
          </p>
        </form>
      </div>
    </main>

    <script src="/web/js/login.js"></script>
  </body>
</html>
